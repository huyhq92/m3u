name: TV44 - 4note + VTV Go + freem3u (full/ngvhiem/vmttv)

on:
  workflow_dispatch:
  schedule:
    # Moi 2 gio, sau khi sync input (:00) va update full (:30) da chay xong
    - cron: "50 */2 * * *"

permissions:
  contents: write

concurrency:
  group: tv44
  cancel-in-progress: false

jobs:
  tv44:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Cai dat Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Dung tv44.m3u (nhom dung theo nguon 4note + VTV Go tu full.m3u)
        run: |
          python3 - << 'PYEOF'
          import os
          import re
          import sys
          import urllib.request

          SRC_URL = "https://4note.net/raw/psmsicxdcn"
          SNAPSHOT = "tv44-source.m3u"   # ban chup nguon 4note gan nhat tai duoc (du phong khi Cloudflare chan)
          FULL = "full.m3u"              # chi de lay nhom VTV Go
          OLD = "tv44.m3u"               # file tv44 hien tai tren repo (de gop kenh cu trung nhom)
          UA = {"User-Agent": "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/120.0.0.0 Safari/537.36"}

          # Cau truc nhom cua tv44.m3u = cac nhom cua nguon 4note (ten + thu tu),
          # chen them "VTV Go" (lay tu full.m3u) ngay sau VTV,
          # va nhom "Thiet yeu" cua nguon duoc GOP LUON vao nhom VTV (Akendu chon).
          GROUP_ORDER = ["VTV", "VTV Go", "HTV", "THVL", "VTVcab",
                         "SCTV", "Địa phương", "Quốc Tế", "Sự Kiện"]
          # Ten nhom dong nghia / nhom gop -> nhom chuan
          GROUP_ALIAS = {"kênhquốctế": "Quốc Tế", "thiếtyếu": "VTV"}
          # Rieng nhom Quoc Te: chi giu cac kenh nay (Akendu chon), con lai loai bo
          QUOCTE_KEEP = {"cinema world", "warner tv", "cartoon network", "kix", "vietnam today"}

          def norm(s):
              return "".join(ch for ch in s.lower() if ch.isalnum())

          CANON = {norm(g): g for g in GROUP_ORDER}
          RANK = {g: i for i, g in enumerate(GROUP_ORDER)}

          def canon(group):
              n = norm(group)
              if n in CANON:
                  return CANON[n]
              return GROUP_ALIAS.get(n)  # None = nhom khong co trong nguon 4note

          def parse(text):
              header = None
              entries = []
              cur = None
              for line in text.splitlines():
                  if line.startswith("#EXTM3U"):
                      header = line.strip()
                  elif line.startswith("#EXTINF"):
                      m = re.search(r'group-title="([^"]*)"', line)
                      cur = {"group": m.group(1) if m else "", "lines": [line], "url": ""}
                      entries.append(cur)
                  elif cur is not None:
                      if line.strip().startswith("http"):
                          cur["lines"].append(line)
                          cur["url"] = line.strip()
                          cur = None
                      elif line.startswith("#"):
                          cur["lines"].append(line)
              return header, [e for e in entries if e["url"]]

          def set_group(entry, name):
              line = entry["lines"][0]
              if 'group-title="' in line:
                  line = re.sub(r'group-title="[^"]*"', 'group-title="' + name + '"', line, count=1)
              else:
                  idx = line.rfind(",")
                  line = line[:idx] + ' group-title="' + name + '"' + line[idx:]
              entry["lines"][0] = line
              entry["group"] = name

          def chan_name(entry):
              return entry["lines"][0].rsplit(",", 1)[-1].strip().lower()

          def keep_entry(entry):
              # Loc dinh dang 4.4 + danh sach giu rieng cho nhom Quoc Te
              if not playable_44(entry):
                  return False
              if entry["group"] == "Quốc Tế" and chan_name(entry) not in QUOCTE_KEEP:
                  return False
              return True

          def playable_44(entry):
              # H&M-TV 4.4 chi phat HLS khong DRM: loai DASH (.mpd/manifest mpd) + ClearKey
              blob = "\n".join(entry["lines"]).lower()
              if ".mpd" in entry["url"].lower():
                  return False
              if "manifest_type=mpd" in blob:
                  return False
              if "license_key" in blob or "license_type=clearkey" in blob:
                  return False
              return True

          # --- 1) Lay nguon 4note (Cloudflare co the chan bot -> dung ban chup gan nhat) ---
          src_text = None
          try:
              req = urllib.request.Request(SRC_URL, headers=UA)
              with urllib.request.urlopen(req, timeout=30) as r:
                  data = r.read().decode("utf-8", errors="strict")
              if data.startswith("#EXTM3U") and data.count("#EXTINF") >= 50:
                  src_text = data
                  print(f"Tai nguon 4note OK: {data.count('#EXTINF')} kenh")
              else:
                  print("Nguon 4note tra ve khong phai playlist (nghi bi Cloudflare chan)")
          except Exception as e:
              print(f"Tai nguon 4note loi: {e}")
          if src_text is None and os.path.exists(SNAPSHOT):
              src_text = open(SNAPSHOT, encoding="utf-8").read()
              print(f"Dung ban chup {SNAPSHOT}: {src_text.count('#EXTINF')} kenh")
          if src_text is None:
              print("Khong co nguon 4note lan ban chup - dung lai, giu nguyen tv44.m3u cu")
              sys.exit(1)
          else:
              with open(SNAPSHOT, "w", encoding="utf-8") as f:
                  f.write(src_text)

          src_header, src_entries = parse(src_text)
          picked = []
          skipped_groups = {}
          for e in src_entries:
              c = canon(e["group"])
              if c is None or c == "VTV Go":
                  skipped_groups[e["group"]] = skipped_groups.get(e["group"], 0) + 1
                  continue
              set_group(e, c)
              picked.append(e)
          print(f"4note thuoc cac nhom chuan: {len(picked)} kenh")
          if skipped_groups:
              print(f"Nhom trong nguon 4note KHONG nam trong cau truc (bo qua): {skipped_groups}")

          # --- 2) VTV Go tu full.m3u ---
          vtvgo = []
          if os.path.exists(FULL):
              _, full_entries = parse(open(FULL, encoding="utf-8").read())
              for e in full_entries:
                  if canon(e["group"]) == "VTV Go":
                      set_group(e, "VTV Go")
                      vtvgo.append(e)
          print(f"VTV Go tu full.m3u: {len(vtvgo)} kenh")

          # --- 3) Hop nhat: nguon la chinh; kenh cu chi gop vao khi TRUNG nhom chuan ---
          merged = []
          seen = set()
          for e in picked + vtvgo:
              if e["url"] in seen or not keep_entry(e):
                  continue
              seen.add(e["url"])
              merged.append(e)
          floor = len(merged)  # muc san: khong bao gio duoc it hon so kenh tu nguon + VTV Go

          folded = 0
          dropped = {}
          merged_names = {chan_name(e) for e in merged}
          merged_ids = {re.search(r'tvg-id="([^"]*)"', e["lines"][0], re.I).group(1).lower() for e in merged if re.search(r'tvg-id="([^"]*)"', e["lines"][0], re.I)}
          if os.path.exists(OLD):
              _, old_entries = parse(open(OLD, encoding="utf-8").read())
              for e in old_entries:
                  c = canon(e["group"])
                  if c is None:
                      dropped[e["group"]] = dropped.get(e["group"], 0) + 1
                      continue
                  if e["url"] in seen or chan_name(e) in merged_names or (re.search(r'tvg-id="([^"]*)"', e["lines"][0], re.I) and re.search(r'tvg-id="([^"]*)"', e["lines"][0], re.I).group(1).lower() in merged_ids) or not playable_44(e):
                      continue
                  if c == "Quốc Tế" and chan_name(e) not in QUOCTE_KEEP:
                      dropped["Quốc Tế (ngoài danh sách giữ)"] = dropped.get("Quốc Tế (ngoài danh sách giữ)", 0) + 1
                      continue
                  set_group(e, c)
                  seen.add(e["url"])
                  merged.append(e)
                  merged_names.add(chan_name(e))
                  folded += 1
              print(f"Gop them tu tv44 cu (trung nhom chuan): {folded} kenh")
              if dropped:
                  print(f"Kenh cu khong thuoc nhom 4note (khong dua vao tv44, van con trong full.m3u/output.m3u): {dropped}")

          merged.sort(key=lambda e: RANK[e["group"]])  # sort on dinh: giu thu tu trong nhom

          if len(merged) < floor or len(merged) < 100:
              print(f"CANH BAO: ket qua {len(merged)} kenh (san {floor}) - dung lai de khong mat kenh nguon")
              sys.exit(1)

          # --- 4) Gop link freem3u: kenh nao co link freem3u o nguon khac thi doi sang ---
          # Thu tu uu tien nguon cho: 4note (src_entries) > full.m3u > ngvhiem > vmttv.
          # Chi doi URL (+ tuy chon cua link moi neu co); giu nguyen ten/logo/nhom cua kenh.
          import unicodedata
          import urllib.request as _rq
          
          def _norm_name(n):
              n = unicodedata.normalize("NFD", n.lower())
              n = "".join(ch for ch in n if unicodedata.category(ch) != "Mn")
              n = n.replace("đ", "d")
              n = re.sub(r"\b(hd|fhd|4k|sd|tv|vn|vietnam)\b", "", n)
              return "".join(ch for ch in n if ch.isalnum())
          
          def _fetch_text(u):
              try:
                  req = _rq.Request(u, headers=UA)
                  with _rq.urlopen(req, timeout=30) as r:
                      t = r.read().decode("utf-8", errors="replace")
                  return t if "#EXTINF" in t else None
              except Exception as e:
                  print(f"Tai nguon cho freem3u loi ({u}): {e}")
                  return None
          
          donor_by_key = {}
          def _add_donors(entries, tag):
              n0 = len(donor_by_key)
              for de in entries:
                  if "freem3u.xyz" not in de["url"] or not playable_44(de):
                      continue
                  ext = de["lines"][0]
                  mt = re.search(r'tvg-id="([^"]*)"', ext, re.I)
                  if mt and mt.group(1).strip():
                      donor_by_key.setdefault("id:" + mt.group(1).strip().lower(), de)
                  donor_by_key.setdefault("nm:" + _norm_name(chan_name(de)), de)
              print(f"Nguon cho {tag}: tong khoa kenh freem3u = {len(donor_by_key)} (truoc {n0})")
          
          _add_donors(src_entries, "4note")
          if os.path.exists(FULL):
              _add_donors(parse(open(FULL, encoding="utf-8").read())[1], "full.m3u")
          for _u, _tag in [("https://raw.githubusercontent.com/ngvhiem/IPTV/refs/heads/main/IPTV.m3u", "ngvhiem"),
                           ("https://raw.githubusercontent.com/vuminhthanh12/vuminhthanh12/refs/heads/main/vmttv", "vmttv")]:
              _t = _fetch_text(_u)
              if _t:
                  _add_donors(parse(_t)[1], _tag)
          
          swapped = 0
          for e in merged:
              if "freem3u.xyz" in e["url"] or not (any(x in e["url"].lower() for x in ("vnns.net", "dpdns.org", ".php", "kutt.to")) or e["url"].lower().startswith("http://")):
                  continue
              ext = e["lines"][0]
              mt = re.search(r'tvg-id="([^"]*)"', ext, re.I)
              donor = None
              if mt and mt.group(1).strip():
                  donor = donor_by_key.get("id:" + mt.group(1).strip().lower())
              if donor is None:
                  donor = donor_by_key.get("nm:" + _norm_name(chan_name(e)))
              if donor is None:
                  continue
              donor_opts = [l for l in donor["lines"][1:] if l.startswith("#")]
              own_opts = [l for l in e["lines"][1:] if l.startswith("#")]
              e["lines"] = [ext] + (donor_opts if donor_opts else own_opts) + [donor["url"]]
              e["url"] = donor["url"]
              swapped += 1
          free_total = sum(1 for e in merged if "freem3u.xyz" in e["url"])
          print(f"Da doi sang freem3u: {swapped} kenh | tong kenh freem3u trong tv44: {free_total}/{len(merged)}")
          # Chong trung sau doi link: cac dong gop-tu-cu/fold-in co the trung het
          # (cung URL + cung ten kenh) voi dong nguon sau khi doi sang freem3u.
          # Bo ban sao, giu dong dau tien (dong cua nguon). Khong dedupe thi moi
          # lan chay workflow danh sach lai phong to dan.
          _seen_pair = set()
          _deduped = []
          for e in merged:
              _pair = (e["url"], chan_name(e))
              if _pair in _seen_pair:
                  continue
              _seen_pair.add(_pair)
              _deduped.append(e)
          print(f"Loai dong trung (URL+ten): {len(merged) - len(_deduped)}")
          merged = _deduped

          header = src_header or '#EXTM3U url-tvg="https://epg.io.vn/epg.xml.gz"'
          with open(OLD, "w", encoding="utf-8") as f:
              f.write(header + "\n")
              for e in merged:
                  f.write("\n".join(e["lines"]) + "\n")
          qt_names = [chan_name(e) for e in merged if e["group"] == "Quốc Tế"]
          print(f"Quoc Te giu lai ({len(qt_names)}): {qt_names}")
          print(f"Da ghi tv44.m3u: {len(merged)} kenh")
          PYEOF

      - name: Commit tv44.m3u neu co thay doi
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add tv44.m3u tv44-source.m3u
          git diff --staged --quiet && echo "Khong co thay doi" && exit 0
          git commit -m "Tu dong cap nhat tv44.m3u (4note + VTV Go + gop link freem3u)"
          git pull --rebase origin main
          git push
