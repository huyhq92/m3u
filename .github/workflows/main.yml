name: IPTV Script Python Auto

on:
  workflow_dispatch:
  schedule:
    # Chạy mỗi ngày lúc 00:00 UTC
    - cron: "0 0 * * *"

permissions:
  contents: write
jobs:
  check-iptv:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout mã nguồn
      uses: actions/checkout@v4

    - name: Cài đặt Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Cài đặt thư viện mạng cần thiết
      run: pip install requests

    - name: Kiểm tra link sống/chết và xuất output.m3u + tv44.m3u
      run: |
        python3 - << 'PYEOF'
        import os
        import re
        import sys

        import requests

        SRC = "full.m3u"          # nguon goc nguyen ven (workflow update-full tu cap nhat)
        OUT_ALL = "output.m3u"    # cac nhom duoi day, kenh con song, GIU NGUYEN cau hinh
        OUT_44 = "tv44.m3u"       # nhu output nhung chi kenh phat duoc tren Android 4.4

        # Chi lay kenh thuoc cac nhom nay (so khop khong tinh emoji/hoa-thuong)
        WANTED_GROUPS = [
            "🌟VTV & VTVCab🌟",
            "🌟VTV Go🌟",
            "🌟HTV🌟",
            "🌟SCTV🌟",
            "🌟Địa Phương🌟",
            "🌟Hoạt Hình🌟",
            "🌟Kênh Quốc Tế🌟",
            "🌟VIP MOVIE🌟",
            "🌟VIP SPORTS🌟",
            "Sự Kiện TV360",
            "🇻🇳 TV360 EVENTS",
        ]

        HEADERS = {
            "User-Agent": "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/120.0.0.0 Safari/537.36"
        }
        VALID_STATUS = {200, 301, 302, 403, 405}
        SKIP_CHECK = os.environ.get("SKIP_CHECK") == "1"

        def norm(s):
            return "".join(ch for ch in s.lower() if ch.isalnum())

        WANTED = {norm(g) for g in WANTED_GROUPS}

        def parse(text):
            header = "#EXTM3U"
            entries = []
            cur = None
            for line in text.splitlines():
                if line.startswith("#EXTM3U"):
                    header = line.strip()
                elif line.startswith("#EXTINF"):
                    m = re.search(r'group-title="([^"]*)"', line)
                    cur = {"group": m.group(1) if m else "", "lines": [line], "url": ""}
                    entries.append(cur)
                elif cur is not None:
                    if line.strip().startswith("http"):
                        cur["lines"].append(line)
                        cur["url"] = line.strip()
                        cur = None
                    elif line.startswith("#"):
                        cur["lines"].append(line)
            return header, [e for e in entries if e["url"]]

        def playable_44(entry):
            # Ban H&M-TV 4.4 (framework player) chi phat HLS khong DRM:
            # loai DASH (.mpd / manifest_type=mpd) va ClearKey (license_key/clearkey)
            blob = "\n".join(entry["lines"]).lower()
            if ".mpd" in entry["url"].lower():
                return False
            if "manifest_type=mpd" in blob:
                return False
            if "license_key" in blob or "license_type=clearkey" in blob:
                return False
            return True

        cache = {}

        def alive(url):
            if SKIP_CHECK:
                return True
            if url in cache:
                return cache[url]
            try:
                r = requests.head(url, headers=HEADERS, timeout=5, allow_redirects=True)
                ok = r.status_code in VALID_STATUS
                print(f"  {'OK ' if ok else 'DIE'} ({r.status_code}) {url[:90]}")
            except Exception:
                # Loi mang/timeout (mang quoc te) -> giu lai du phong cho mang VN
                ok = True
                print(f"  KEEP (loi mang/timeout) {url[:90]}")
            cache[url] = ok
            return ok

        if not os.path.exists(SRC):
            print(f"Khong thay {SRC} - dung lai, khong ghi de file cu")
            sys.exit(1)

        with open(SRC, encoding="utf-8") as f:
            header, entries = parse(f.read())
        print(f"{SRC}: {len(entries)} kenh")

        picked = [e for e in entries if norm(e["group"]) in WANTED]
        print(f"Thuoc 11 nhom da chon: {len(picked)} kenh - bat dau kiem tra link...")

        live = [e for e in picked if alive(e["url"])]
        print(f"Con song: {len(live)}/{len(picked)}")

        live44 = [e for e in live if playable_44(e)]
        print(f"Trong do phat duoc tren Android 4.4: {len(live44)}")

        if not live:
            print("0 kenh song - nghi ngo loi mang dien rong, dung lai de bao toan file cu")
            sys.exit(1)

        def dump(path, items):
            with open(path, "w", encoding="utf-8") as f:
                f.write(header + "\n")
                for e in items:
                    f.write("\n".join(e["lines"]) + "\n")
            print(f"Da ghi {path}: {len(items)} kenh")

        dump(OUT_ALL, live)
        dump(OUT_44, live44)
        PYEOF

    - name: Cập nhật file sạch lên GitHub
      run: |
        git config --local user.email "action@github.com"
        git config --local user.name "GitHub Action"
        git add output.m3u tv44.m3u
        git commit -m "Robot Python tự động cập nhật danh sách kênh sạch" || exit 0
        git pull --rebase origin main || true
        git push
