name: IPTV Checker Auto

on:
  workflow_dispatch: # Cho phép bạn bấm nút chạy thủ công bất kỳ lúc nào

jobs:
  check-iptv:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout mã nguồn
      uses: actions/checkout@v4

    - name: Cài đặt Node.js
      uses: actions/setup-node@v4
      with:
        node-version: 20

    - name: Cài đặt công cụ kiểm tra IPTV nâng cao
      run: npm install -g iptv-checker

    - name: Chạy kiểm tra link (Giả lập đầu phát TV)
      # Lệnh này thêm cấu hình giả lập User-Agent của VLC Media Player để đài truyền hình không chặn robot
      run: |
        iptv-checker -i input.m3u -o output.m3u --timeout 8000 -u "VLC/3.0.18 LibVLC/3.0.18" || true
        touch output.m3u

    - name: Cập nhật file sạch lên GitHub
      run: |
        git config --local user.email "action@github.com"
        git config --local user.name "GitHub Action"
        git add output.m3u
        git commit -m "Robot tự động cập nhật danh sách kênh sạch" || exit 0
        git push
