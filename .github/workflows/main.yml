name: IPTV Script Python Auto

on:
  workflow_dispatch:

jobs:
  check-iptv:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout mã nguồn
      uses: actions/checkout@v4

    - name: Cài đặt Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Cài đặt thư viện mạng cần thiết
      run: pip install requests

    - name: Tự động chạy Script Python kiểm tra luồng kênh
      run: |
        python -c '
        import requests
        import re

        try:
            with open("input.m3u", "r", encoding="utf-8") as f:
                content = f.read()
        except FileNotFoundError:
            print("Không tìm thấy file input.m3u")
            exit(1)

        lines = content.splitlines()
        output_lines = ["#EXTM3U"]
        
        headers = {
            "User-Agent": "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/120.0.0.0 Safari/537.36"
        }

        current_info = None
        for line in lines:
            line = line.strip()
            if not line:
                continue
            if line.startswith("#EXTM3U"):
                continue
            if line.startswith("#EXTINF"):
                current_info = line
            elif line.startswith("http"):
                if current_info:
                    print(f"Đang kiểm tra: {line}")
                    try:
                        # Gửi yêu cầu kết nối nhanh để kiểm tra link
                        response = requests.head(line, headers=headers, timeout=5, allow_redirects=True)
                        # Nếu phản hồi tốt (200, 301, 302) hoặc chặn IP nhưng link tồn tại (403, 405) thì giữ lại
                        if response.status_code in:
                            output_lines.append(current_info)
                            output_lines.append(line)
                            print(f" -> OK (Mã {response.status_code})")
                        else:
                            print(f" -> LỖI (Mã {response.status_code})")
                    except Exception as e:
                        # Nếu lỗi timeout mạng quốc tế thì vẫn giữ lại dự phòng cho mạng VN xem
                        output_lines.append(current_info)
                        output_lines.append(line)
                        print(" -> Giữ lại (Lỗi mạng hoặc Timeout)")
                    current_info = None

        with open("output.m3u", "w", encoding="utf-8") as f:
            f.write("\n".join(output_lines) + "\n")
        print("Đã hoàn thành kiểm tra bằng code!")
        '

    - name: Cập nhật file sạch lên GitHub
      run: |
        git config --local user.email "action@github.com"
        git config --local user.name "GitHub Action"
        git add output.m3u
        git commit -m "Robot Python tự động cập nhật danh sách kênh sạch" || exit 0
        git push
