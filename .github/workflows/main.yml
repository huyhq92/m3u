name: IPTV Checker Auto

on:
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch:

jobs:
  check-iptv:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout mã nguồn
      uses: actions/checkout@v4

    - name: Cài đặt Node.js
      uses: actions/setup-node@v4
      with:
        node-version: 20

    - name: Cài đặt công cụ IPTV Checker chính xác
      run: npm install -g iptv-checker

    - name: Chạy kiểm tra link
      run: |
        iptv-checker -i input.m3u -o output.m3u --timeout 5000 --no-check || true
        # Lệnh dự phòng: Tạo file trống nếu công cụ không sinh ra file output.m3u
        touch output.m3u 

    - name: Cập nhật file sạch lên GitHub
      run: |
        git config --local user.email "action@github.com"
        git config --local user.name "GitHub Action"
        git add output.m3u
        git commit -m "Robot tự động cập nhật danh sách kênh sạch" || exit 0
        git push
